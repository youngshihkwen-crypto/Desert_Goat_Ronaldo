name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld g++
      - name: Build and test
        shell: pwsh
        run: ./build.ps1
